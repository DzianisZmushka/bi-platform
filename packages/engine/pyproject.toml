[project]
name = "obi-engine"
version = "0.0.0"
description = "Thin semantic query engine (sqlglot + DuckDB, Arrow end-to-end)"
requires-python = ">=3.12,<3.13"
dependencies = ["obi-formats"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obi_engine"]

[tool.uv.sources]
obi-formats = { workspace = true }
