[project]
name = "obi-cli"
version = "0.0.0"
description = "obi command line: validate, render (later: download/upload/deploy)"
requires-python = ">=3.12,<3.13"
dependencies = ["obi-formats", "obi-engine"]

[project.scripts]
obi = "obi_cli.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obi_cli"]

[tool.uv.sources]
obi-formats = { workspace = true }
obi-engine = { workspace = true }
