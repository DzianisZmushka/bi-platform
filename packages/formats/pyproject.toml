[project]
name = "obi-formats"
version = "0.0.0"
description = "JSON Schemas, canonical serializer and validator for project artifacts"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jsonschema>=4.23",
    "ruamel-yaml>=0.18",
    "sqlglot>=25",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obi_formats"]


[project.scripts]
obi-formats = "obi_formats.__main__:main"
