[project]
name = "obi-runtime"
version = "0.0.0"
description = "obi runtime: user store and sessions, Git-backed deploy (ADR-014)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "obi-formats",
    "obi-engine",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/obi_runtime"]

[tool.uv.sources]
obi-formats = { workspace = true }
obi-engine = { workspace = true }
