dashboard: revenue-overview
title: Revenue overview
description: Monthly health check of net revenue, margin and orders.
model: sales

filters:
  - filter: period
    dimension: date
    default: last_12_months
  - filter: region
    dimension: region
  - filter: channel
    dimension: channel

pages:
  - page: overview
    items:
      - row: headline
        items:
          - kpi: revenue
            measure: net_revenue
            compare: previous_year
          - kpi: margin
            measure: margin_pct
            compare: previous_year
          - kpi: order_count
            measure: orders
            compare: previous_year
          - kpi: basket
            measure: aov
            compare: previous_year
      - grid: main
        columns: [2, 1]
        items:
          - chart: revenue_trend
            mark: line
            x: date.month
            y: net_revenue
            series: channel
          - chart: revenue_by_category
            mark: bar
            x: net_revenue
            y: category
            sort: -net_revenue
      - table: top_customers
        title: Top 10 customers
        rows: [customer_name, segment, region]
        values: [net_revenue, orders, margin_pct]
        sort: -net_revenue
        limit: 10
        cells:
          margin_pct: { color: "${value < 0.3 ? 'danger' : 'ok'}" }
