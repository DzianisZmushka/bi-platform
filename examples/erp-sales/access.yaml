access: erp-sales
description: Who may see and write what in order-to-cash. Users and their roles come from the identity provider, never from Git.

attributes:
  sales_orgs:
    type: list
    description: Sales organisations (VKORG, such as DE01) the user works for. Without it a user sees no rows.

roles:
  default:
    description: Everyone who signs in.
    view: { dashboards: ["*"], forms: ["*"] }
    read: ["*"]
  sales_rep:
    description: Writes notes on open items of their sales orgs; never sees the shipment plan.
    edit: { forms: [order-note] }
    deny:
      view: { forms: [shipment-plan] }
      read: [shipment_plans]
  sales_manager:
    description: Approves notes, sets next steps and keeps the shipment plan for their sales orgs.
    edit: { forms: ["*"] }
  planner:
    description: Keeps the shipment plan only.
    edit: { forms: [shipment-plan] }
  finance:
    description: Reads cost and margin for every sales org and writes nothing.
    rows: all
    deny:
      edit: { forms: ["*"] }
      write: ["*"]
  auditor:
    description: Reads everything in their sales orgs and never writes, whatever other roles they hold.
    deny:
      edit: { forms: ["*"] }
      write: ["*"]
  admin:
    description: Everything, every row.
    edit: { forms: ["*"] }
    rows: all

# Cost is visible only to those who manage margin; reps see revenue but not WAVWR.
columns:
  order_items.WAVWR: { read: [sales_manager, finance, admin] }
  order_notes.next_step: { write: [sales_manager, admin] }
