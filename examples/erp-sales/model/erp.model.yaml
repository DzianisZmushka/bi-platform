model: erp
title: Order to cash
description: SAP SD sales orders (VBAK/VBAP), deliveries (LIPS) and billing (VBRP) with their master data, reported in USD.

currency:
  target: USD
  rates: { table: tcurr, currency: FCURR, month: GDATU, rate: UKURS }

entities:
  order_items:
    description: Sales order items (VBAP). Amounts are in the order's document currency.
    table: vbap
    key: [VBELN, POSNR]
    currency: { code: document_currency, date: order_date }
    joins: { orders: VBELN, materials: MATNR }
    rollups:
      billed_quantity: { sum: FKIMG, from: billing_items }
      delivered_quantity: { sum: LFIMG, from: deliveries }
    dimensions:
      item: { column: POSNR }
      rejection_reason: { column: ABGRU }
    measures:
      order_value: { sum: NETWR, format: currency }
      order_value_usd: { sum: NETWR, convert: USD, format: currency }
      cost_usd: { sum: WAVWR, convert: USD, format: currency }
      margin: { calc: order_value_usd - cost_usd, format: currency }
      margin_pct: { calc: margin / order_value_usd, format: percent }
      billable_value_usd:
        sum: NETWR
        where: rejection_reason is null
        convert: USD
        format: currency
      open_order_value_usd:
        sum: (KWMENG - billed_quantity) * NETWR / KWMENG
        description: Snapshot (ADR-010), the current state, not a sum over a period.
        where: rejection_reason is null
        convert: USD
        format: currency
      shipped_not_billed_usd:
        sum: (delivered_quantity - billed_quantity) * NETWR / KWMENG
        label: Shipped, not billed
        description: Snapshot (ADR-010), the current state, not a sum over a period.
        where: rejection_reason is null
        convert: USD
        format: currency
      delivered_value_usd:
        sum: delivered_quantity * NETWR / KWMENG
        label: Delivered value USD
        convert: USD
        format: currency
      return_value_usd: { sum: NETWR, where: order_type = 'ZRE', convert: USD, format: currency }
      order_count: { count_distinct: VBELN, format: integer }
      item_count: { count: POSNR, format: integer }
      rejected_items: { count: POSNR, where: rejection_reason is not null, format: integer }
      rejection_rate: { calc: rejected_items / item_count, format: percent }

  orders:
    table: vbak
    key: VBELN
    joins: { calendar: ERDAT, customers: KUNNR, sales_orgs: VKORG }
    dimensions:
      sales_order: { column: VBELN }
      order_date: { column: ERDAT, type: date }
      order_type: { column: AUART }
      document_currency: { column: WAERK }

  deliveries:
    description: Delivery items (LIPS), linked to the order item they ship; dated at goods issue.
    table: lips
    key: [VBELN, POSNR]
    joins: { calendar: WADAT, order_items: [VGBEL, VGPOS] }
    dimensions:
      delivery: { column: VBELN }
      goods_issue_date: { column: WADAT, type: date }
    measures:
      delivered_quantity_total: { sum: LFIMG, label: Delivered quantity, format: integer }
      delivery_count: { count_distinct: VBELN, format: integer }

  order_notes:
    description: One note per order item, written from the open-orders table, with a review status.
    table: order_notes
    writable: true
    per: order_items
    columns:
      note: { type: text, required: true, check: length(note) <= 1000 }
      next_step:
        type: string
        choices: [call customer, check stock, wait for payment, cancel item]
      status:
        type: string
        required: true
        default: draft
        choices: [draft, submitted, approved]
    workflow:
      column: status
      transitions:
        submit: { from: draft, to: submitted }
        approve: { from: submitted, to: approved, by: "${user.roles.includes('sales_manager')}" }
        reopen:
          from: [submitted, approved]
          to: draft
          by: "${user.roles.includes('sales_manager')}"
    dimensions:
      note_status: { column: status }
      note_by: { column: updated_by }

  shipment_plans:
    description: Planned shipment value per sales organisation and week, kept by sales ops in the shipment-plan sheet.
    table: shipment_plans
    key: [VKORG, week_start]
    writable: true
    columns:
      VKORG: { label: Sales org, type: string, required: true, references: sales_org }
      week_start: { label: Week, type: date, required: true }
      planned_value_usd:
        label: Planned shipments USD
        type: number
        required: true
        check: planned_value_usd >= 0
    joins: { calendar: week_start, sales_orgs: VKORG }
    measures:
      planned_shipments_usd: { sum: planned_value_usd, label: Planned shipments, format: currency }
      shipment_plan_attainment:
        calc: delivered_value_usd / planned_shipments_usd
        label: Plan attainment
        format: percent

  billing_items:
    description: Billing items (VBRP), linked to the order item they bill; dated and converted at billing.
    table: vbrp
    key: [VBELN, POSNR]
    currency: { code: document_currency, date: billing_date }
    joins: { calendar: FKDAT, order_items: [AUBEL, AUPOS] }
    dimensions:
      billing_date: { column: FKDAT, type: date }
    measures:
      billed_value_usd: { sum: NETWR, convert: USD, format: currency }
      billed_by_order_date_usd: { sum: NETWR, date: order_date, convert: USD, format: currency }
      billed_pct: { calc: billed_value_usd / billable_value_usd, format: percent }

  calendar:
    description: Fiscal year starts 1 April; periods come from the table, not from date arithmetic.
    table: calendar
    key: DATUM
    dimensions:
      date:
        column: DATUM
        type: date
        fiscal: { year: FISCAL_YEAR, period: FISCAL_PERIOD }

  customers:
    table: kna1
    key: KUNNR
    dimensions:
      customer: { column: NAME1 }
      country: { column: LAND1 }

  sales_orgs:
    table: tvko
    key: VKORG
    access: { where: sales_org_code in user.sales_orgs }
    joins: { company_codes: BUKRS }
    dimensions:
      sales_org: { column: VTEXT }
      sales_org_code: { column: VKORG }

  company_codes:
    table: t001
    key: BUKRS
    dimensions:
      company_code: { column: BUTXT }

  materials:
    table: mara
    key: MATNR
    dimensions:
      material: { column: MAKTX }
      material_group: { column: MATKL }
      product_line: { lookup: t179t.VTEXT, key: PRODH, match: "left(PRDHA, 5)" }
      product_family: { lookup: t179t.VTEXT, key: PRODH, match: "left(PRDHA, 10)" }
      product_model: { lookup: t179t.VTEXT, key: PRODH, match: PRDHA }

hierarchies:
  product: [product_line, product_family, product_model]
  organisation: [company_code, sales_org]
  geography: [country, customer]
