# docker compose -f deploy/compose.yaml up -d   (runbook: docs/deploy.md)
services:
  obi:
    build: ..
    restart: unless-stopped
    env_file: obi.env          # OBI_GIT_URL, OBI_GIT_PATH, OBI_SECRET_KEY, OBI_DEPLOY_TOKEN; never in Git
    volumes:
      - obi:/srv/obi           # releases, project database, users
    ports:
      - "127.0.0.1:8765:8765"  # only the reverse proxy reaches it
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    command: caddy reverse-proxy --from ${OBI_DOMAIN:?set OBI_DOMAIN} --to obi:8765
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy:/data            # certificates
volumes:
  obi:
  caddy:
